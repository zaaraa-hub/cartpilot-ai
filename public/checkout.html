<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CartPilot Checkout</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="checkout-page">

    <div class="checkout-card">

      <span class="badge">
        DEMO CHECKOUT
      </span>

      <h1>Ready to order?</h1>

      <div id="product">
        Loading product...
      </div>

      <form id="shippingForm" class="shipping-form">

        <h3>Shipping details</h3>

        <input type="text" id="fullName" placeholder="Full name" required>
        <div class="phone-row">
        <select id="countryCode" required>
        <option value="+91" selected>🇮🇳 +91</option>
        <option value="+1">🇺🇸 +1</option>
       <option value="+44">🇬🇧 +44</option>
       <option value="+971">🇦🇪 +971</option>
       <option value="+49">🇩🇪 +49</option>
       <option value="+65">🇸🇬 +65</option>
       <option value="+61">🇦🇺 +61</option>
       <option value="+81">🇯🇵 +81</option>
  </select>

  <input
    type="tel"
    id="phone"
    placeholder="Phone number"
    inputmode="numeric"
    autocomplete="tel"
    required
  >
</div>
        <input type="text" id="address" placeholder="Address (house no., street, area)" required>
        <div class="shipping-row">
          <input type="text" id="city" placeholder="City" required>
          <input type="text" id="pincode" placeholder="Pincode" required>
        </div>

        <div id="sizeFields"></div>

        <button type="submit" class="checkout-button">
          Continue to Payment
        </button>

      </form>

      <div id="paymentSection" class="payment-options" style="display:none">

        <button onclick="completeOrder('UPI')">
          ⚡ 1-Click UPI
        </button>


        <button onclick="completeOrder('COD')">
          Cash on Delivery
        </button>

      </div>


      <p class="disclaimer">

        Demo only — no real payment is processed.

        A production version would integrate an
        approved Razorpay checkout flow securely
        on the server.

      </p>

    </div>

  </main>


  <script>

    const params =
      new URLSearchParams(
        window.location.search
      );

    const productId = params.get("productId");
    const isCartCheckout = params.get("cart") === "1";

    const INR = new Intl.NumberFormat("en-IN", {
      style: "currency",
      currency: "INR",
      maximumFractionDigits: 0
    });

    function getCart() {
      try {
        return JSON.parse(localStorage.getItem("cartpilot_cart")) || [];
      } catch {
        return [];
      }
    }

    // Unified list of { product, qty } this checkout is for
    let orderItems = [];

    async function loadOrder() {
      if (isCartCheckout) {
        const cart = getCart();

        if (!cart.length) {
          document.getElementById("product").innerHTML =
            `<p>Your cart is empty. <a href="/" style="color:#818cf8">Go back and add something.</a></p>`;
          document.getElementById("shippingForm").style.display = "none";
          return;
        }

        const products = await Promise.all(
          cart.map((item) => fetch(`/api/product/${item.id}`).then((r) => r.json()))
        );

        orderItems = cart.map((item, i) => ({ product: products[i], qty: item.qty }));
      } else {
        const product = await fetch(`/api/product/${productId}`).then((r) => r.json());
        orderItems = [{ product, qty: 1 }];
      }

      renderOrderSummary();
      renderSizeFields();
    }

    function renderOrderSummary() {
      const total = orderItems.reduce((sum, { product, qty }) => sum + product.price * qty, 0);

      document.getElementById("product").innerHTML = `
        <div class="checkout-product">
          ${orderItems.map(({ product, qty }) => `
            <div class="checkout-cart-row">
              <span>${product.name}${qty > 1 ? ` × ${qty}` : ""}</span>
              <span>${INR.format(product.price * qty)}</span>
            </div>
          `).join("")}
          <h2 class="checkout-total-row">
            Total: ${INR.format(total)}
          </h2>
        </div>
      `;
    }

    function renderSizeFields() {
      const withSizes = orderItems.filter(({ product }) => product.sizes && product.sizes.length);

      document.getElementById("sizeFields").innerHTML = withSizes.map(({ product }) => `
        <label class="size-label">
          Size for "${product.name}"
          <select id="size-${product.id}" required>
            <option value="" disabled selected>Choose size</option>
            ${product.sizes.map((s) => `<option value="${s}">${s}</option>`).join("")}
          </select>
        </label>
      `).join("");
    }

    document.getElementById("shippingForm").addEventListener("submit", (event) => {
  event.preventDefault();

  const countryCode = document.getElementById("countryCode").value;
  const phoneInput = document.getElementById("phone");
  const phone = phoneInput.value.trim();

  // India: exactly 10 digits
  if (countryCode === "+91" && !/^\d{10}$/.test(phone)) {
    alert("Please enter a valid 10-digit Indian phone number.");
    phoneInput.focus();
    return;
  }

  // Other countries: basic digit validation
  if (!/^\d{6,15}$/.test(phone)) {
    alert("Please enter a valid phone number.");
    phoneInput.focus();
    return;
  }

  document.getElementById("shippingForm").style.display = "none";
  document.getElementById("paymentSection").style.display = "grid";
});

    loadOrder();

    function completeOrder(method) {

      const shipping = {
        name: document.getElementById("fullName").value,
        phone:
  document.getElementById("countryCode").value +
  " " +
  document.getElementById("phone").value,
        address: document.getElementById("address").value,
        city: document.getElementById("city").value,
        pincode: document.getElementById("pincode").value
      };

      if (isCartCheckout) {
        localStorage.removeItem("cartpilot_cart");
      }

      document.querySelector(
        ".checkout-card"
      ).innerHTML = `

        <span class="badge">
          ORDER COMPLETE
        </span>

        <h1>
          🎉 Demo order placed!
        </h1>

        <p>
          Your ${method} checkout flow
          was simulated successfully.
        </p>

        <p class="disclaimer">
          Shipping to ${shipping.name}, ${shipping.address},
          ${shipping.city} - ${shipping.pincode} · ${shipping.phone}
        </p>

        <br>

<a href="/" style="color: #818cf8">
  ← Back to CartPilot AI
</a>

      `;

    }

  </script>

</body>
</html>

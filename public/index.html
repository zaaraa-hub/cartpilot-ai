<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CartPilot AI</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <header>
      <div>
        <h1>CartPilot <span>AI</span></h1>
        <p>Your autonomous shopping assistant</p>
      </div>

      <button id="cartButton" class="cart-button" onclick="openCart()">
        🛒 Cart
        <span id="cartCount" class="cart-count">0</span>
      </button>
    </header>


    <div class="chat-container">

      <div class="chat-header">
        🟢 CartPilot AI
      </div>


      <div id="chatMessages" class="chat-messages">

        <div class="message bot">
          👋 Hey! What are you looking for?

          <br><br>

          Try:
          <b>"Party dress under ₹2,500"</b>
        </div>

      </div>


      <form id="chatForm" class="chat-input">

        <input
          type="text"
          id="userInput"
          placeholder="Tell me what you're looking for..."
        >

        <button type="submit">
          Send
        </button>

      </form>

    </div>

  </div>

  <div id="cartOverlay" class="cart-overlay" onclick="closeCartOnOverlay(event)">
    <div class="cart-panel">
      <div class="cart-panel-header">
        <h2>Your Cart</h2>
        <button class="cart-close" onclick="closeCart()">✕</button>
      </div>
      <div id="cartItems" class="cart-items"></div>
      <div id="cartFooter" class="cart-footer"></div>
    </div>
  </div>

  <script src="script.js"></script>

</body>
</html>
